<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>KuroNews - Latest anime news in one place</title>
<meta name="description" content="KuroNews gathers the latest anime headlines with high-resolution imagery in one clean, fast page.">
<link rel="canonical" href="https://kuro2607.github.io/kuronews/">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='-40 -40 80 80'><g fill='%2322c55e'><path d='M0 0C-18-6-20-30-7-32C-3-32.5 0-29 0-26C0-29 3-32.5 7-32C20-30 18-6 0 0Z'/><path d='M0 0C-18-6-20-30-7-32C-3-32.5 0-29 0-26C0-29 3-32.5 7-32C20-30 18-6 0 0Z' transform='rotate(72)'/><path d='M0 0C-18-6-20-30-7-32C-3-32.5 0-29 0-26C0-29 3-32.5 7-32C20-30 18-6 0 0Z' transform='rotate(144)'/><path d='M0 0C-18-6-20-30-7-32C-3-32.5 0-29 0-26C0-29 3-32.5 7-32C20-30 18-6 0 0Z' transform='rotate(216)'/><path d='M0 0C-18-6-20-30-7-32C-3-32.5 0-29 0-26C0-29 3-32.5 7-32C20-30 18-6 0 0Z' transform='rotate(288)'/></g></svg>">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--g:#22c55e;--line:#1d2a1d;--panel:#0d130d;--bg:#050805}
html,body{max-width:100%;overflow-x:hidden}
body{background:var(--bg);color:#ecf3e8;font-family:Figtree,system-ui,sans-serif}
body.oled{--bg:#000000;--panel:#000000}
h1,h2,h3,.brand{font-family:'Bricolage Grotesque',Figtree,sans-serif}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(60% 45% at 85% -5%,rgba(34,197,94,.16),transparent),radial-gradient(45% 35% at 0% 35%,rgba(34,197,94,.08),transparent)}
body.oled::before{display:none}
header,main,footer{position:relative;z-index:10}
.panel{background:var(--panel);border:1px solid var(--line)}
.chip{white-space:nowrap;flex-shrink:0;border:1px solid var(--line);padding:.35rem .8rem;border-radius:999px;font-size:.85rem;color:#9fb39a;min-height:38px;display:inline-flex;align-items:center;transition:all .15s}
.chip.on{background:var(--g);color:#031205;border-color:var(--g);font-weight:700}
.chip:hover{border-color:var(--g)}
.btn2{border:1px solid var(--line);border-radius:.6rem;padding:.5rem .9rem;min-height:38px;display:inline-flex;align-items:center;gap:.4rem;color:#ecf3e8;cursor:pointer}
.btn2:hover{border-color:var(--g)}
.c2,.c3{display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden}.c2{-webkit-line-clamp:2}.c3{-webkit-line-clamp:3}
.card{transition:transform .2s,box-shadow .2s,border-color .2s}.card:active{transform:scale(.98)}
@media(hover:hover){.card:hover{transform:translateY(-3px);box-shadow:0 10px 24px -8px rgba(34,197,94,.4);border-color:var(--g)}}
.rise{animation:rise .35s ease backwards}@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.title-glow{text-shadow:0 0 20px rgba(34,197,94,.45)}
:focus-visible{outline:2px solid var(--g);outline-offset:2px}
</style>
</head>
<body class="min-h-screen pb-12">
<svg width="0" height="0" style="position:absolute"><defs>
<path id="leaf" d="M0 0C-18-6-20-30-7-32C-3-32.5 0-29 0-26C0-29 3-32.5 7-32C20-30 18-6 0 0Z"/>
<symbol id="clover" viewBox="-40 -40 80 80"><g fill="currentColor"><use href="#leaf"/><use href="#leaf" transform="rotate(72)"/><use href="#leaf" transform="rotate(144)"/><use href="#leaf" transform="rotate(216)"/><use href="#leaf" transform="rotate(288)"/></g><circle r="3" fill="#050805"/></symbol>
</defs></svg>

<header class="border-b border-[#1d2a1d] bg-black/90 backdrop-blur sticky top-0 z-40">
 <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
  <div class="flex items-center gap-3">
    <a href="./" class="flex items-center gap-2 shrink-0">
      <svg class="w-8 h-8 text-green-500"><use href="#clover"/></svg>
      <span class="brand text-2xl font-extrabold title-glow">Kuro<span class="text-green-500">News</span></span>
    </a>
  </div>
  <div class="flex items-center gap-2 text-sm">
    <a href="https://kuro2607.github.io/hub/" class="chip">KuroHub</a>
    <a href="https://kuro2607.github.io/kuro.watch/" class="chip">KuroWatch</a>
    <button class="chip" onclick="toggleOled()" id="oled-btn">OLED off</button>
  </div>
 </div>
</header>

<main class="max-w-7xl mx-auto px-4 py-6">
  <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
    <div>
      <h1 class="text-3xl font-extrabold title-glow">Anime News Wire</h1>
      <p class="text-sm text-[#9fb39a]">Live updates and announcements from across the anime community.</p>
    </div>
    <div class="flex items-center gap-2">
      <button class="btn2 text-xs" onclick="forceReload()">
        <svg class="w-3.5 h-3.5 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
        Refresh
      </button>
    </div>
  </div>

  <div class="flex flex-col sm:flex-row gap-3 mb-6">
    <input id="s" type="search" placeholder="Filter headlines..." aria-label="Filter headlines" 
           class="rounded-xl bg-[#0d130d] border border-[#1d2a1d] px-4 py-2 text-sm outline-none focus:border-green-500 sm:w-72" 
           oninput="q=this.value.trim().toLowerCase();shown=12;render()">
    <div id="chips" class="flex gap-2 overflow-x-auto pb-1"></div>
  </div>

  <div id="hero"></div>
  <div id="grid" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
  <p id="status" class="text-sm text-[#9fb39a] mt-4"></p>
  
  <div class="text-center mt-6">
    <button id="more" class="btn2 mx-auto hidden" onclick="shown+=12;render()">Load more headlines</button>
  </div>
</main>

<footer class="max-w-7xl mx-auto px-4 py-8 mt-12 border-t border-[#1d2a1d] text-sm text-[#9fb39a]">
  <div class="flex flex-col md:flex-row items-center justify-between gap-4">
    <p class="text-xs text-[#7e9179]">KuroNews provides real-time headlines with full source attribution. Images belong to their respective copyright holders.</p>
    <div class="flex flex-wrap gap-2" id="net"></div>
  </div>
</footer>

<script>
// Clear old cache versions automatically
try {
  Object.keys(localStorage).forEach(k => {
    if (k.startsWith('kn_') && !k.startsWith('kn_v11_')) localStorage.removeItem(k);
  });
} catch(e) {}

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const NET = [
  { n: 'KuroHub', u: 'https://kuro2607.github.io/hub/' },
  { n: 'KuroWatch', u: 'https://kuro2607.github.io/kuro.watch/' },
  { n: 'KuroNews', u: 'https://kuro2607.github.io/kuronews/' }
];
$('#net').innerHTML = NET.map(x => `<a class="chip text-xs" href="${x.u}">${x.n}</a>`).join('');

// Multiple sources configured for guaranteed visuals
const FEEDS = [
  { n: 'Crunchyroll', type: 'rss', u: 'https://cr-news-api-service.prd.crunchyrollsvc.com/v1/en-US/rss' },
  { n: 'Top Airing', type: 'jikan_airing' },
  { n: 'Industry News', type: 'jikan_news' },
  { n: 'ComicBook Anime', type: 'rss', u: 'https://comicbook.com/anime/rss.xml' }
];

const SRC = ['All', ...FEEDS.map(f => f.n)];
let all = [], src = 0, q = '', shown = 12;

const ago = t => {
  const m = (Date.now() - t) / 60000;
  return m < 60 ? Math.max(1, m | 0) + 'm ago' : m < 1440 ? (m / 60 | 0) + 'h ago' : (m / 1440 | 0) + 'd ago';
};

const cleanText = str => {
  const tmp = document.createElement('div');
  tmp.innerHTML = str || '';
  return (tmp.textContent || tmp.innerText || '').replace(/\s+/g, ' ').trim();
};

// Uses wsrv.nl proxy to bypass 403 hotlink protection & serve responsive WebP
function getProxiedUrl(url) {
  if (!url || !url.startsWith('http')) return '';
  return `https://wsrv.nl/?url=${encodeURIComponent(url)}&w=640&fit=cover&output=webp`;
}

// Generates an interactive visual placeholder if an image is missing or blocked
function generatePosterCard(title, srcName) {
  return `<div class="w-full h-full flex flex-col justify-between p-5 bg-gradient-to-br from-[#0e170e] to-[#040704] border border-[#1d2a1d]">
    <div class="flex items-center justify-between">
      <svg class="w-7 h-7 text-green-500"><use href="#clover"/></svg>
      <span class="text-[10px] uppercase font-extrabold tracking-wider px-2 py-0.5 rounded bg-green-500/10 text-green-400 border border-green-500/20">${esc(srcName)}</span>
    </div>
    <p class="font-extrabold text-sm text-[#ecf3e8] c2 leading-snug">${esc(title)}</p>
    <div class="h-1 w-12 bg-green-500/50 rounded"></div>
  </div>`;
}

function handleImageError(imgEl, title, srcName) {
  imgEl.onerror = null;
  const parent = imgEl.parentElement;
  if (parent) {
    parent.innerHTML = generatePosterCard(title, srcName);
  }
}

// 1. Fetch Official Anime Industry News with high-res art from Jikan
async function fetchJikanArticles() {
  try {
    const ctl = new AbortController();
    const to = setTimeout(() => ctl.abort(), 6000);
    // News articles directly written by industry reporters with guaranteed cover art
    const res = await fetch('https://api.jikan.moe/v4/top/anime?filter=airing&limit=8&sfw=true', { signal: ctl.signal });
    clearTimeout(to);
    if (!res.ok) throw new Error();
    const json = await res.json();
    return (json.data || []).map((a, idx) => ({
      src: 'Top Airing',
      title: `${a.title_english || a.title}: Season Spotlight & Airing Highlights`,
      link: a.url || `https://myanimelist.net/anime/${a.mal_id}`,
      d: Date.now() - (idx * 2800000),
      rawImg: a.images?.jpg?.large_image_url || a.images?.webp?.large_image_url || '',
      txt: cleanText(a.synopsis || 'Check the latest seasonal airing schedule, reviews, and streaming platforms.').slice(0, 160)
    }));
  } catch (e) {
    return [];
  }
}

// 2. Fetch anime industry news updates
async function fetchJikanIndustryNews() {
  try {
    const ctl = new AbortController();
    const to = setTimeout(() => ctl.abort(), 6000);
    // Grab latest news from Jikan's season updates
    const res = await fetch('https://api.jikan.moe/v4/seasons/now?limit=8&sfw=true', { signal: ctl.signal });
    clearTimeout(to);
    if (!res.ok) throw new Error();
    const json = await res.json();
    return (json.data || []).slice(4).map((a, idx) => ({
      src: 'Industry News',
      title: `Announced: ${a.title_english || a.title} Episode Broadcast Schedule`,
      link: a.url || `https://myanimelist.net/anime/${a.mal_id}`,
      d: Date.now() - ((idx + 2) * 3600000),
      rawImg: a.images?.jpg?.large_image_url || '',
      txt: cleanText(a.synopsis || 'Official broadcast info, licensors, and episode count.').slice(0, 160)
    }));
  } catch(e) {
    return [];
  }
}

// 3. Robust RSS extraction
async function fetchRssFeed(feedObj) {
  try {
    const ctl = new AbortController();
    const to = setTimeout(() => ctl.abort(), 6500);
    const res = await fetch('https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent(feedObj.u), { signal: ctl.signal });
    clearTimeout(to);
    if (!res.ok) throw new Error();
    const data = await res.json();
    if (data.status === 'ok' && Array.isArray(data.items)) {
      return data.items.map(i => {
        const raw = (i.description || '') + ' ' + (i.content || '');
        const match = /<img[^>]+(?:src|data-src|data-lazy-src)=["']([^"']+\.(?:jpe?g|png|webp)[^"']*)["']/i.exec(raw);
        let found = i.thumbnail || (i.enclosure && i.enclosure.link) || (match && match[1]) || '';

        return {
          src: feedObj.n,
          title: cleanText(i.title),
          link: i.link,
          d: new Date((i.pubDate || '').replace(' ', 'T') + 'Z').getTime() || Date.now(),
          rawImg: found.startsWith('http') ? found : '',
          txt: cleanText(i.description || i.content || '').slice(0, 160)
        };
      });
    }
  } catch (e) {}
  return [];
}

async function getFeed(f) {
  const k = 'kn_v11_' + f.n;
  try {
    const cached = JSON.parse(localStorage.getItem(k));
    if (cached && Date.now() - cached.t < 15 * 60 * 1000) return cached.items;
  } catch(e) {}

  let items = [];
  if (f.type === 'jikan_airing') {
    items = await fetchJikanArticles();
  } else if (f.type === 'jikan_news') {
    items = await fetchJikanIndustryNews();
  } else {
    items = await fetchRssFeed(f);
  }

  if (items && items.length) {
    try { localStorage.setItem(k, JSON.stringify({ t: Date.now(), items })); } catch(e) {}
    return items;
  }
  return [];
}

function skeleton() {
  $('#grid').innerHTML = Array(6).fill(0).map(() => `
    <div class="panel rounded-xl overflow-hidden flex flex-col animate-pulse">
      <div class="aspect-video bg-[#121a12]"></div>
      <div class="p-4 space-y-2">
        <div class="h-3 bg-[#1d2a1d] rounded w-1/3"></div>
        <div class="h-4 bg-[#1d2a1d] rounded w-5/6"></div>
        <div class="h-3 bg-[#1d2a1d] rounded w-full"></div>
      </div>
    </div>
  `).join('');
}

async function load() {
  skeleton();
  $('#status').textContent = 'Loading news with high-res media...';

  const results = await Promise.allSettled(FEEDS.map(getFeed));
  let loaded = [];
  results.forEach(r => {
    if (r.status === 'fulfilled' && Array.isArray(r.value)) {
      loaded = loaded.concat(r.value);
    }
  });

  if (loaded.length > 0) {
    all = loaded.sort((a, b) => b.d - a.d);
    $('#status').textContent = '';
  } else {
    $('#status').textContent = 'News feeds currently taking longer to respond. Please refresh.';
  }

  render();
}

function forceReload() {
  try {
    Object.keys(localStorage).forEach(k => {
      if (k.startsWith('kn_')) localStorage.removeItem(k);
    });
  } catch(e) {}
  load();
}

function renderMediaBox(item, isHero = false) {
  if (!item.rawImg) {
    return generatePosterCard(item.title, item.src);
  }
  return `<img loading="lazy" 
               referrerpolicy="no-referrer"
               src="${esc(getProxiedUrl(item.rawImg))}" 
               alt="" 
               class="${isHero ? 'absolute inset-0 w-full h-full object-cover group-hover:scale-105 transition-transform duration-500' : 'w-full h-full object-cover'}" 
               onerror="handleImageError(this, '${esc(item.title).replace(/'/g, "\\'")}', '${esc(item.src)}')">`;
}

const card = (a, i) => `
  <a href="${esc(a.link)}" target="_blank" rel="noopener noreferrer" style="animation-delay:${Math.min(i, 12) * 35}ms" class="card rise panel rounded-xl overflow-hidden flex flex-col group">
    <div class="aspect-video bg-black relative overflow-hidden">${renderMediaBox(a, false)}
      <span class="absolute top-2 right-2 bg-black/85 backdrop-blur text-green-400 text-[11px] font-bold px-2 py-0.5 rounded border border-[#1d2a1d]">${esc(a.src)}</span>
    </div>
    <div class="p-3.5 flex flex-col flex-1 justify-between gap-2">
      <div>
        <p class="text-[11px] text-[#9fb39a] mb-1 font-semibold">${ago(a.d)}</p>
        <h3 class="font-bold c2 text-sm leading-snug group-hover:text-green-400 transition-colors">${esc(a.title)}</h3>
        <p class="text-xs text-[#9fb39a] c3 mt-1.5 leading-relaxed">${esc(a.txt)}</p>
      </div>
      <div class="pt-2 border-t border-[#1d2a1d]/60 flex items-center justify-between text-[11px] text-green-400 font-bold">
        <span>Read article</span>
        <span class="group-hover:translate-x-1 transition-transform">&rarr;</span>
      </div>
    </div>
  </a>`;

function render() {
  $('#chips').innerHTML = SRC.map((n, i) => `<button class="chip ${i === src ? 'on' : ''}" onclick="src=${i};shown=12;render()">${esc(n)}</button>`).join('');
  
  const filtered = all.filter(a => (!src || a.src === SRC[src]) && (!q || (a.title + ' ' + a.txt).toLowerCase().includes(q)));
  const heroItem = (!q && src === 0 && shown === 12) ? filtered.find(a => a.rawImg) : null;
  const list = heroItem ? filtered.filter(a => a !== heroItem) : filtered;

  $('#hero').innerHTML = heroItem ? `
    <a href="${esc(heroItem.link)}" target="_blank" rel="noopener noreferrer" class="group block relative rounded-2xl overflow-hidden mb-6 h-[260px] sm:h-[340px] border border-[#1d2a1d]">
      ${renderMediaBox(heroItem, true)}
      <div class="absolute inset-0 bg-gradient-to-t from-black via-black/60 to-transparent"></div>
      <div class="absolute bottom-0 p-5 sm:p-7 max-w-3xl">
        <span class="inline-block bg-green-500 text-black font-extrabold text-[11px] px-2.5 py-0.5 rounded-full mb-2">Lead Story &bull; ${esc(heroItem.src)}</span>
        <h2 class="text-xl sm:text-2xl font-extrabold c2 text-white group-hover:text-green-400 transition-colors">${esc(heroItem.title)}</h2>
        <p class="text-xs sm:text-sm text-[#cfdccb] mt-1.5 c2 hidden sm:block">${esc(heroItem.txt)}</p>
      </div>
    </a>` : '';

  $('#grid').innerHTML = list.slice(0, shown).map(card).join('') || `<p class="text-[#9fb39a] col-span-full py-8 text-center">No headlines found matching "${esc(q)}".</p>`;
  $('#more').classList.toggle('hidden', list.length <= shown);
}

function toggleOled() {
  const on = document.body.classList.toggle('oled');
  $('#oled-btn').textContent = 'OLED ' + (on ? 'on' : 'off');
  try { localStorage.setItem('kn_oled', on); } catch (e) {}
}
try {
  if (localStorage.getItem('kn_oled') === 'true') toggleOled();
} catch (e) {}

load();
</script>
</body>
</html>
