<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>KuroNews - Latest anime news in one place</title>
<meta name="description" content="KuroNews gathers the latest anime headlines from top news sites in one clean, fast page.">
<link rel="canonical" href="https://kuro2607.github.io/kuronews/">
<meta name="robots" content="index, follow">
<meta property="og:type" content="website"><meta property="og:title" content="KuroNews - Latest anime news in one place"><meta property="og:description" content="KuroNews gathers the latest anime headlines from top news sites in one clean, fast page."><meta property="og:url" content="https://kuro2607.github.io/kuronews/">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='-40 -40 80 80'>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
<style>*,::before,::after{box-sizing:border-box;border-width:0;border-style:solid;border-color:#1d2a1d}html{line-height:1.5;-webkit-text-size-adjust:100%}body{margin:0;line-height:inherit}h1,h2,h3,h4,p,figure{margin:0}h1,h2,h3,h4{font-size:inherit;font-weight:inherit}a{color:inherit;text-decoration:inherit}button,input,select,textarea{font-family:inherit;font-size:100%;font-weight:inherit;line-height:inherit;color:inherit;margin:0;padding:0}button{background:transparent;cursor:pointer}select{background:transparent}input::placeholder{color:#6b7f67}img,svg,video,canvas{display:block;vertical-align:middle}img,video{max-width:100%;height:auto}[hidden]{display:none}

:root{--g:#22c55e;--line:#1d2a1d}
html,body{max-width:100%;overflow-x:hidden}
body{background:#050805;color:#ecf3e8;font-family:Figtree,system-ui,sans-serif}
h1,h2,h3,.brand{font-family:'Bricolage Grotesque',Figtree,sans-serif}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(60% 45% at 85% -5%,rgba(34,197,94,.16),transparent),radial-gradient(45% 35% at 0% 35%,rgba(34,197,94,.08),transparent)}
header,main,footer{position:relative;z-index:10}
.panel{background:#0d130d;border:1px solid var(--line)}
.chip{white-space:nowrap;flex-shrink:0;border:1px solid var(--line);padding:.35rem .8rem;border-radius:999px;font-size:.85rem;color:#9fb39a;min-height:40px;display:inline-flex;align-items:center}
.chip.on{background:var(--g);color:#031205;border-color:var(--g);font-weight:700}
.chip:hover{border-color:var(--g)}
.btn{background:var(--g);color:#031205;font-weight:700;border-radius:.6rem;padding:.5rem .9rem;min-height:40px;display:inline-flex;align-items:center;justify-content:center}
.btn2{border:1px solid var(--line);border-radius:.6rem;padding:.5rem .9rem;min-height:40px;display:inline-flex;align-items:center}
.btn2:hover{border-color:var(--g)}
.c2,.c3{display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden}.c2{-webkit-line-clamp:2}.c3{-webkit-line-clamp:3}
input,select{font-size:16px}
.card{transition:transform .2s,box-shadow .2s}.card:active{transform:scale(.98)}
@media(hover:hover){.card:hover{transform:translateY(-4px);box-shadow:0 10px 30px -8px rgba(34,197,94,.5)}}
.rise{animation:rise .5s backwards}@keyframes rise{from{opacity:0;transform:translateY(12px)}}
.title-glow{text-shadow:0 0 22px rgba(34,197,94,.45)}
:focus-visible{outline:2px solid var(--g);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.absolute{position:absolute}.aspect-video{aspect-ratio:16/9}.bg-\[\#0d130d\]{background-color:#0d130d}.bg-black{background-color:#000000}.bg-black\/90{background-color:rgb(0 0 0/0.9)}.bg-gradient-to-t{background-image:linear-gradient(to top,var(--tw-gs))}.block{display:block}.border{border-width:1px}.border-\[\#1d2a1d\]{border-color:#1d2a1d}.border-b{border-bottom-width:1px}.border-t{border-top-width:1px}.bottom-0{bottom:0}.flex{display:flex}.flex-col{flex-direction:column}.flex-wrap{flex-wrap:wrap}.focus\:border-green-500:focus{border-color:#22c55e}.font-bold{font-weight:700}.font-extrabold{font-weight:800}.from-black{--tw-gf:#000;--tw-gs:var(--tw-gf),var(--tw-gt,transparent)}.gap-1\.5{gap:0.375rem}.gap-2{gap:0.5rem}.gap-3{gap:0.75rem}.gap-4{gap:1rem}.grid{display:grid}.h-16{height:4rem}.h-9{height:2.25rem}.h-\[260px\]{height:260px}.h-full{height:100%}.inset-0{inset:0}.items-center{align-items:center}.justify-center{justify-content:center}.max-w-7xl{max-width:80rem}.mb-1{margin-bottom:0.25rem}.mb-3{margin-bottom:0.75rem}.mb-4{margin-bottom:1rem}.min-h-screen{min-height:100vh}.mt-4{margin-top:1rem}.mt-6{margin-top:1.5rem}.mx-auto{margin-left:auto;margin-right:auto}.object-cover{object-fit:cover}.outline-none{outline:2px solid transparent;outline-offset:2px}.overflow-hidden{overflow:hidden}.overflow-x-auto{overflow-x:auto}.p-3{padding:0.75rem}.p-4{padding:1rem}.px-4{padding-left:1rem;padding-right:1rem}.py-2{padding-top:0.5rem;padding-bottom:0.5rem}.py-3{padding-top:0.75rem;padding-bottom:0.75rem}.py-6{padding-top:1.5rem;padding-bottom:1.5rem}.py-8{padding-top:2rem;padding-bottom:2rem}.relative{position:relative}.rounded-3xl{border-radius:1.5rem}.rounded-xl{border-radius:.75rem}.shrink-0{flex-shrink:0}.text-2xl{font-size:1.5rem;line-height:2rem}.text-3xl{font-size:1.875rem;line-height:2.25rem}.text-\[\#9fb39a\]{color:#9fb39a}.text-center{text-align:center}.text-green-400{color:#4ade80}.text-green-500{color:#22c55e}.text-green-500\/40{color:rgb(34 197 94/0.4)}.text-sm{font-size:.875rem;line-height:1.25rem}.text-xl{font-size:1.25rem;line-height:1.75rem}.text-xs{font-size:.75rem;line-height:1rem}.to-transparent{--tw-gt:transparent}.via-black\/50{--tw-gs:var(--tw-gf),rgb(0 0 0/.5),var(--tw-gt,transparent)}.w-16{width:4rem}.w-9{width:2.25rem}.w-full{width:100%}.hidden{display:none!important}@media(min-width:640px){.sm\:grid-cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}.sm\:h-\[360px\]{height:360px}.sm\:p-8{padding:2rem}.sm\:text-4xl{font-size:2.25rem;line-height:2.5rem}.sm\:w-72{width:18rem}}@media(min-width:1024px){.lg\:grid-cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(min-width:640px){.sm\:flex-row{flex-direction:row}}@keyframes pulse{50%{opacity:.5}}</style></head>
<body class="min-h-screen">
<svg width="0" height="0" style="position:absolute"><defs><path id="leaf" d="M0 0C-18-6-20-30-7-32C-3-32.5 0-29 0-26C0-29 3-32.5 7-32C20-30 18-6 0 0Z"/><symbol id="clover" viewBox="-40 -40 80 80"><g fill="currentColor"><use href="#leaf"/><use href="#leaf" transform="rotate(72)"/><use href="#leaf" transform="rotate(144)"/><use href="#leaf" transform="rotate(216)"/><use href="#leaf" transform="rotate(288)"/></g><circle r="3" fill="#050805"/></symbol></defs></svg>
<header class="border-b border-[#1d2a1d] bg-black/90">
 <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center gap-3">
  <a href="./" class="flex items-center gap-2 shrink-0"><svg class="w-9 h-9 text-green-500" style="filter:drop-shadow(0 0 8px rgba(34,197,94,.7))"><use href="#clover"/></svg><span class="brand text-2xl font-extrabold title-glow">Kuro<span class="text-green-500">News</span></span></a>
  
 </div></header>
<main class="max-w-7xl mx-auto px-4 py-6">
<h1 class="text-3xl font-extrabold title-glow mb-1">Anime news</h1>
<p class="text-sm text-[#9fb39a] mb-4">Headlines from top anime news sites, all in one place. Tap a story to read it on the original site.</p>
<div class="flex flex-col sm:flex-row gap-3 mb-4">
  <input id="s" type="search" placeholder="Filter headlines" aria-label="Filter headlines" class="rounded-xl bg-[#0d130d] border border-[#1d2a1d] px-4 py-2 outline-none focus:border-green-500 sm:w-72" oninput="q=this.value.trim().toLowerCase();shown=12;render()">
  <div id="chips" class="flex gap-2 overflow-x-auto"></div>
</div>
<div id="hero"></div>
<div id="grid" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
<p id="status" class="text-sm text-[#9fb39a] mt-4"></p>
<div class="text-center mt-4"><button id="more" class="btn2 hidden" onclick="shown+=12;render()">Load more</button></div>
</main>
<footer class="max-w-7xl mx-auto px-4 py-8 mt-6 border-t border-[#1d2a1d] text-sm text-[#9fb39a]"><p class="mb-3" id="note"></p><div class="flex flex-wrap gap-2" id="net"></div></footer>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const NET=[{n:'KuroWatch',u:'https://kuro2607.github.io/kuro.watch/'},{n:'KuroNews',u:'https://kuro2607.github.io/kuronews/'},{n:'KuroManga',u:'https://kuro2607.github.io/kuromanga/'}];
$('#net').innerHTML=NET.map(x=>`<a class="chip" href="${x.u}">${x.n}</a>`).join('');

$('#note').textContent='KuroNews links to the original publishers and shows only short excerpts. All articles belong to their authors.';
const FEEDS=[
 {n:'Anime News Network',u:'https://www.animenewsnetwork.com/all/rss.xml?ann-edition=w'},
 {n:'MyAnimeList',u:'https://myanimelist.net/rss/news.xml'},
 {n:'Anime Corner',u:'https://animecorner.me/feed/'}];
const SRC=['All',...FEEDS.map(f=>f.n)];
let all=[],src=0,q='',shown=12;
const ago=t=>{const m=(Date.now()-t)/6e4;return m<60?Math.max(1,m|0)+' min ago':m<1440?(m/60|0)+' h ago':(m/1440|0)+' d ago'};
const plain=h=>new DOMParser().parseFromString(h||'','text/html').body.textContent.replace(/\s+/g,' ').trim();
async function feed(f){
  const k='kn_'+f.n;let c;try{c=JSON.parse(localStorage.getItem(k))}catch(e){}
  if(c&&Date.now()-c.t<9e5)return c.items;
  try{
    const r=await fetch('https://api.rss2json.com/v1/api.json?rss_url='+encodeURIComponent(f.u));
    const j=await r.json();if(j.status!=='ok')throw new Error('feed');
    const items=j.items.filter(i=>/^https?:\/\//.test(i.link)).map(i=>({
      src:f.n,title:plain(i.title),link:i.link,
      d:new Date((i.pubDate||'').replace(' ','T')+'Z').getTime()||Date.now(),
      img:[i.thumbnail,i.enclosure&&i.enclosure.link,(/<img[^>]+src=["']([^"']+)/.exec(i.description||i.content||'')||[])[1]].find(u=>u&&u.startsWith('https://'))||'',
      txt:plain(i.description).slice(0,170)}));
    try{localStorage.setItem(k,JSON.stringify({t:Date.now(),items}))}catch(e){}
    return items;
  }catch(e){if(c)return c.items;throw e}
}
async function load(){
  $('#status').textContent='Loading the latest news...';
  const r=await Promise.allSettled(FEEDS.map(feed));
  all=r.flatMap(x=>x.status==='fulfilled'?x.value:[]).sort((a,b)=>b.d-a.d);
  const bad=r.filter(x=>x.status==='rejected').length;
  $('#status').textContent=!all.length?'Could not load news right now. Check your connection and try again in a minute.':bad?bad+' source(s) are unavailable at the moment.':'';
  render();
}
const img=a=>a.img?`<img loading="lazy" src="${esc(a.img)}" alt="" class="w-full h-full object-cover">`:'<div class="w-full h-full flex items-center justify-center text-green-500/40"><svg class="w-16 h-16"><use href="#clover"/></svg></div>';
const card=a=>`<a href="${esc(a.link)}" target="_blank" rel="noopener noreferrer" class="card rise panel rounded-xl overflow-hidden flex flex-col">
  <div class="aspect-video bg-black">${img(a)}</div>
  <div class="p-3 flex flex-col gap-1.5"><p class="text-xs text-green-400 font-bold">${esc(a.src)} - ${ago(a.d)}</p>
  <h3 class="font-bold c3">${esc(a.title)}</h3><p class="text-sm text-[#9fb39a] c3">${esc(a.txt)}</p></div></a>`;
function render(){
  $('#chips').innerHTML=SRC.map((n,i)=>`<button class="chip ${i===src?'on':''}" onclick="src=${i};shown=12;render()">${esc(n)}</button>`).join('');
  const L=all.filter(a=>(!src||a.src===SRC[src])&&(!q||(a.title+' '+a.txt).toLowerCase().includes(q)));
  const h=!q&&shown===12?L.find(a=>a.img):null,rest=L.filter(a=>a!==h);
  $('#hero').innerHTML=h?`<a href="${esc(h.link)}" target="_blank" rel="noopener noreferrer" class="block relative rounded-3xl overflow-hidden mb-4 h-[260px] sm:h-[360px] border border-[#1d2a1d]">
    <img src="${esc(h.img)}" alt="" class="absolute inset-0 w-full h-full object-cover"><div class="absolute inset-0 bg-gradient-to-t from-black via-black/50 to-transparent"></div>
    <div class="absolute bottom-0 p-4 sm:p-8"><p class="text-green-400 text-sm font-bold">Top story - ${esc(h.src)}</p><h2 class="text-xl sm:text-4xl font-extrabold c3">${esc(h.title)}</h2></div></a>`:'';
  $('#grid').innerHTML=rest.slice(0,shown).map(card).join('')||(all.length?'<p class="text-[#9fb39a]">No headlines match your filter.</p>':'');
  $('#more').classList.toggle('hidden',rest.length<=shown);
}
const _q=new URLSearchParams(location.search).get('q');if(_q){q=_q.trim().toLowerCase();$('#s').value=_q}
load();

</script></body></html>
